<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#03040c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="icon" type="image/svg+xml" href="favicon.svg" />

    <title>Driftfield</title>
    <meta
      name="description"
      content="A neon twin-stick shooter where the arena is a fluid simulation. Every explosion pushes the same velocity field the smoke, the sparks and the grid all read from."
    />

    <!-- Link previews (iMessage, WhatsApp, Slack, Signal, social). Scrapers do not run JavaScript, so
         these live in the static HTML. og:image must be an absolute URL, and there is no screenshot yet —
         so it is left out deliberately rather than pointed at a file that 404s, which is worse than no
         preview image at all. When one is added, version the filename: WhatsApp and iMessage cache a
         preview against the image URL for a long time. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Driftfield" />
    <meta property="og:title" content="Driftfield" />
    <meta
      property="og:description"
      content="A neon twin-stick shooter where the arena is a fluid simulation."
    />
    <meta property="og:url" content="https://emmettl.github.io/driftfield/" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Driftfield" />
    <meta
      name="twitter:description"
      content="A neon twin-stick shooter where the arena is a fluid simulation."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
